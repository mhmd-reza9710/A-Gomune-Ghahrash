<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آ گومون آشتیاش 😍</title>

<style>

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-Regular.woff2") format("woff2");
    font-weight: 400;
}

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-Medium.woff2") format("woff2");
    font-weight: 500;
}

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-SemiBold.woff2") format("woff2");
    font-weight: 600;
}

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-Bold.woff2") format("woff2");
    font-weight: 700;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Estedad", sans-serif;
    font-weight: 700;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    min-height:100svh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color:white;

    overflow:hidden;

    position:relative;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(255,80,150,.22),
            transparent 35%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(150,70,255,.18),
            transparent 40%
        ),

        #120b16;

    animation:pageFadeIn .5s ease;
}


/* پترن */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:
        url("images/pattern.png");

    background-repeat:repeat;

    background-size:180px 180px;

    opacity:.12;

    pointer-events:none;
}


/* صفحه */

.page{

    width:100%;
    height:100svh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:30px 22px;

    position:relative;

    z-index:2;

    animation:contentEnter .7s ease;
}


/* قلب */

.heart{

    font-size:65px;

    margin-bottom:30px;

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,95,158,.65)
        );

    animation:
        heartbeat 1.7s infinite,
        textAppear .8s ease;
}


/* متن اصلی */

.message{

    max-width:380px;

    font-size:24px;

    line-height:2.2;

    margin-bottom:40px;

    text-shadow:
        0 2px 12px
        rgba(0,0,0,.5);

    animation:textAppear 1s ease;
}


/* دکمه‌ها */

.buttons{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:14px;

    width:100%;

    animation:textAppear 1.15s ease;
}


.button{

    width:210px;

    height:54px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:17px;

    font-family:inherit;

    font-size:17px;

    cursor:pointer;

    transition:
        transform .2s ease;
}


/* آشتی */

.yes{

    color:white;

    border:none;

    background:
        linear-gradient(
            135deg,
            #ff5f9e,
            #c94cff
        );

    box-shadow:
        0 12px 30px
        rgba(255,95,158,.28);
}


/* هنوز قهرم */

.no{

    color:#eee;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.15);
}


.button:active{

    transform:scale(.94);

}


/* پیام نتیجه */

.result{

    display:none;

    max-width:380px;

    margin-top:30px;

    font-size:21px;

    line-height:2;

    color:#ffd9e8;

    animation:
        appear .6s ease;
}


/* قلب‌های انفجاری */

.burst-heart{

    position:fixed;

    font-size:25px;

    pointer-events:none;

    animation:
        burst 1.2s ease-out
        forwards;

    z-index:10;
}


/* انیمیشن ورود صفحه */

@keyframes pageFadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}


@keyframes contentEnter{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* انیمیشن ورود متن */

@keyframes textAppear{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* انیمیشن قلب */

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }

}


/* ظاهر شدن */

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* انفجار قلب */

@keyframes burst{

    0%{
        opacity:1;
        transform:
            translate(0,0)
            scale(.5);
    }

    100%{
        opacity:0;
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(1.4)
            rotate(25deg);
    }

}


/* خروج صفحه */

body.page-exit{

    animation:
        pageFadeOut .35s ease
        forwards;
}


@keyframes pageFadeOut{

    from{
        opacity:1;
    }

    to{
        opacity:0;
    }

}

</style>

</head>


<body>

<main class="page">


    <div class="heart">
        ❤️
    </div>


    <p class="message">
        خب... حالا  آشتی؟ 🥺❤️
    </p>


    <div class="buttons">

        <button
            class="button yes"
            id="yesButton"
        >
            آشتی 🫂
        </button>


        <button
            class="button no"
            id="noButton"
        >
            نیخوم 😤
        </button>

    </div>


    <p
        class="result"
        id="result"
    ></p>


</main>


<script>

const yesButton =
    document.getElementById("yesButton");

const noButton =
    document.getElementById("noButton");

const result =
    document.getElementById("result");


/* آشتی */

yesButton.addEventListener(
    "click",
    function(){

        result.textContent =
            "آ گومونش 😍...  پس بیا بغلممم 🫂❤️";

        result.style.display =
            "block";

        yesButton.style.display =
            "none";

        noButton.style.display =
            "none";


        /* ساختن قلب‌ها */

        for(let i = 0; i < 20; i++){

            const heart =
                document.createElement("span");

            heart.className =
                "burst-heart";

            heart.textContent =
                "❤️";

            heart.style.left =
                "50%";

            heart.style.top =
                "50%";

            heart.style.setProperty(
                "--x",
                `${(Math.random() - .5) * 300}px`
            );

            heart.style.setProperty(
                "--y",
                `${(Math.random() - .5) * 500}px`
            );

            document.body.appendChild(
                heart
            );


            setTimeout(
                () => heart.remove(),
                1200
            );

        }

    }
);


/* هنوز قهرم */

noButton.addEventListener(
    "click",
    function(){

        result.textContent =
            "باشه... من همینجا می‌شینم تا خانومم آشتی کنه 🥺❤️";

        result.style.display =
            "block";

        noButton.style.display =
            "none";

    }
);

</script>

</body>

</html>
