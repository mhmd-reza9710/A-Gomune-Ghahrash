<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آ گومون قهراش 😍</title>

<style>

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-Regular.woff2") format("woff2");
    font-weight: 400;
}

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-Medium.woff2") format("woff2");
    font-weight: 500;
}

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-SemiBold.woff2") format("woff2");
    font-weight: 600;
}

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-Bold.woff2") format("woff2");
    font-weight: 700;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Estedad", sans-serif;
    font-weight: 700;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    min-height:100svh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color:white;

    overflow:hidden;

    position:relative;

    background:
        radial-gradient(
            circle at 20% 15%,
            rgba(255,80,150,.20),
            transparent 35%
        ),

        radial-gradient(
            circle at 85% 85%,
            rgba(150,70,255,.18),
            transparent 40%
        ),

        #120b16;

    animation:pageFadeIn .5s ease;
}


/* پترن */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:
        url("images/pattern.png");

    background-repeat:repeat;

    background-size:180px 180px;

    opacity:.12;

    pointer-events:none;

}


/* صفحه */

.page{

    width:100%;
    height:100svh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:30px 25px;

    position:relative;

    z-index:2;

    animation:contentEnter .7s ease;
}


/* قلب */

.heart{

    font-size:58px;

    margin-bottom:28px;

    filter:
        drop-shadow(
            0 0 12px
            rgba(255,95,158,.65)
        )

        drop-shadow(
            0 0 30px
            rgba(255,95,158,.25)
        );

    animation:heartbeat 1.7s infinite;
}


/* متن */

.message{

    max-width:380px;

    font-size:21px;

    line-height:2;

    color:#fff;

    text-shadow:
        0 2px 12px rgba(0,0,0,.5);

    animation:textAppear 1.1s ease;
}

.last-line{

    display:block;

    margin-top:8px;

    color:#ffd8e8;

    font-size:20px;
}


/* خط */

.line{

    width:75px;

    height:2px;

    margin:
        30px 0
        27px;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff5f9e,
            transparent
        );

    box-shadow:
        0 0 12px
        rgba(255,95,158,.45);
}


/* دکمه */

.button{

    width:190px;
    height:54px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:17px;

    font-size:17px;

    color:white;

    text-decoration:none;

    background:
        linear-gradient(
            135deg,
            #ff5f9e,
            #c94cff
        );

    box-shadow:
        0 12px 30px
        rgba(255,95,158,.25);

    transition:
        transform .2s ease;
}

.button:active{

    transform:scale(.94);

}


/* انیمیشن قلب */

@keyframes heartbeat{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }

}


/* انیمیشن ظاهر شدن */

@keyframes textAppear{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* ترنزیشن ورود صفحه */

@keyframes pageFadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}


/* انیمیشن ورود محتوا */

@keyframes contentEnter{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* ترنزیشن خروج صفحه */

body.page-exit{

    animation:pageFadeOut .35s ease forwards;

}


@keyframes pageFadeOut{

    from{
        opacity:1;
    }

    to{
        opacity:0;
    }

}

</style>

</head>


<body>

<main class="page">

    <div class="heart">
        ❤️
    </div>

    <p class="message">

        شما زندگی من هستی ❤️

        <br>

        و بهت قول میدم که لیاقتت رو دارم عزیزم.

        <span class="last-line">
            امیدوارم یک بار دیگه هم منو ببخشی
            و مثل قبل دوسم داشته باشی 😔❤️‍🩹
        </span>

    </p>

    <div class="line"></div>

    <a
        href="page6.html"
        class="button"
    >
        حالا شاید... 😌
    </a>

</main>


<script>

document.querySelectorAll("a.button").forEach(link => {

    link.addEventListener("click", function(e){

        e.preventDefault();

        document.body.classList.add("page-exit");

        setTimeout(() => {

            window.location.href = this.href;

        }, 350);

    });

});

</script>

</body>

</html>
