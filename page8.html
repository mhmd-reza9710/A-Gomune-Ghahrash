<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>آ گومون قهراش 😍</title>

<style>

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-Regular.woff2") format("woff2");
    font-weight: 400;
}

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-Medium.woff2") format("woff2");
    font-weight: 500;
}

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-SemiBold.woff2") format("woff2");
    font-weight: 600;
}

@font-face {
    font-family: "Estedad";
    src: url("fonts/Estedad-Bold.woff2") format("woff2");
    font-weight: 700;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Estedad", sans-serif;
    font-weight: 700;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    min-height:100svh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color:white;

    overflow:hidden;

    position:relative;

    background:

        radial-gradient(
            circle at 20% 15%,
            rgba(255,80,150,.20),
            transparent 35%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(150,70,255,.18),
            transparent 40%
        ),

        #120b16;

    animation:pageFadeIn .5s ease;
}


/* پترن */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:
        url("images/pattern.png");

    background-repeat:repeat;

    background-size:180px 180px;

    opacity:.12;

    pointer-events:none;
}


/* صفحه */

.page{

    width:100%;
    height:100svh;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;

    padding:30px 22px 0;

    position:relative;

    z-index:2;

    overflow:hidden;

    animation:contentEnter .7s ease;
}


/* محتوای بالا */

.content{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding-top:15px;

    position:relative;

    z-index:2;
}


/* متن */

.message{

    max-width:390px;

    font-size:19px;

    line-height:2;

    margin-bottom:32px;

    text-shadow:
        0 2px 12px
        rgba(0,0,0,.45);

    animation:textAppear 1s ease;
}

.message span {
  font-weight: bold;
  font-size: 26px;
}


/* دکمه */

.button{

    width:190px;

    height:54px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:17px;

    font-size:17px;

    color:white;

    text-decoration:none;

    background:
        linear-gradient(
            135deg,
            #ff5f9e,
            #c94cff
        );

    box-shadow:
        0 12px 30px
        rgba(255,95,158,.25);

    transition:
        transform .2s ease;

    position:relative;

    z-index:3;
}


.button:active{

    transform:scale(.94);

}


/* عکس */

.my-photo{

    width:100vw;

    max-width:430px;

    height:auto;

    display:block;

    margin-top:-70px;

    position:relative;

    z-index:1;

    object-fit:contain;

    filter:
        drop-shadow(
            0 -10px 25px
            rgba(255,95,158,.22)
        );
}


/* انیمیشن ورود صفحه */

@keyframes pageFadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}


@keyframes contentEnter{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* انیمیشن ورود متن */

@keyframes textAppear{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* خروج صفحه */

body.page-exit{

    animation:pageFadeOut .35s ease forwards;
}


@keyframes pageFadeOut{

    from{
        opacity:1;
    }

    to{
        opacity:0;
    }
}

</style>

</head>


<body>

<main class="page">


    <div class="content">

        <p class="message">

            <span>میدونستم 😌❤️</span>

            <br>

            ولی من خیلی خیلی خیلی بیشتر دوست دارم عزیزم ❤️

            <br>

            شما همه زندگی من هستی 🥰

            <br>

            بوس به کل وجودت 😘😘😘

        </p>


        <a
            href="page9.html"
            class="button"
        >
            نه من بیشتر 😍
        </a>

    </div>


    <img
        src="images/5.png"
        alt="❤️"
        class="my-photo"
    >


</main>


<script>

const nextButton =
    document.querySelector(".button");

nextButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        document.body.classList.add("page-exit");

        setTimeout(() => {

            window.location.href = this.href;

        }, 350);

    }
);

</script>

</body>

</html>
